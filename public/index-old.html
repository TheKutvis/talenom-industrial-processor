<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talenom General Ledger Client</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Ensure basic styling loads even if main CSS fails */
        body { background: #0d1117; color: #f0f6fc; font-family: -apple-system, BlinkMacSystemFont, sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1 class="logo">
                    <span class="logo-icon">⚡</span>
                    Talenom GL Client
                </h1>
                <div class="status-indicator" id="statusIndicator">
                    <span class="status-dot"></span>
                    <span class="status-text">Ready</span>
                </div>
            </div>
        </header>

        <!-- Navigation -->
        <nav class="nav-tabs">
            <button class="nav-tab active" data-tab="general-ledger">General Ledger Events</button>
            <button class="nav-tab" data-tab="account-balances">Account Balances</button>
            <button class="nav-tab" data-tab="chart-accounts">Chart of Accounts</button>
            <button class="nav-tab" data-tab="file-upload">File Processing</button>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            
            <!-- General Ledger Events Tab -->
            <section id="general-ledger-tab" class="tab-content active">
                <div class="form-section">
                    <h2 class="section-title">General Ledger Events Query</h2>
                    <form id="generalLedgerForm" class="form">
                        <div class="form-grid">
                            <div class="form-group">
                                <label for="orgNumber">Organization Number *</label>
                                <input type="text" id="orgNumber" name="organizationNumber" required 
                                       placeholder="e.g., 1234567-8" class="form-input">
                            </div>
                            
                            <div class="form-group">
                                <label for="pageIndex">Page Index *</label>
                                <input type="number" id="pageIndex" name="pageIndex" value="0" min="0" required class="form-input">
                            </div>
                            
                            <div class="form-group">
                                <label for="pageSize">Page Size *</label>
                                <input type="number" id="pageSize" name="pageSize" value="100" min="1" max="10000" required class="form-input">
                            </div>
                            
                            <div class="form-group">
                                <label for="fromDate">From Date</label>
                                <input type="date" id="fromDate" name="fromDate" class="form-input">
                            </div>
                            
                            <div class="form-group">
                                <label for="toDate">To Date</label>
                                <input type="date" id="toDate" name="toDate" class="form-input">
                            </div>
                            
                            <div class="form-group">
                                <label for="accountNumbers">Account Numbers</label>
                                <input type="text" id="accountNumbers" name="accountNumbers" 
                                       placeholder="e.g., 1701,3000" class="form-input">
                                <small class="form-hint">Comma-separated list of account numbers</small>
                            </div>
                            
                            <div class="form-group">
                                <label for="category">Category</label>
                                <select id="category" name="category" class="form-select">
                                    <option value="">All Categories</option>
                                    <option value="ePurchaseInvoice">ePurchase Invoice</option>
                                    <option value="PurchaseInvoice">Purchase Invoice</option>
                                    <option value="TravelExpense">Travel Expense</option>
                                    <option value="eSalesInvoice">eSales Invoice</option>
                                    <option value="SalesInvoice">Sales Invoice</option>
                                    <option value="Cash">Cash</option>
                                    <option value="Salary">Salary</option>
                                    <option value="Receipts">Receipts</option>
                                    <option value="Memo">Memo</option>
                                    <option value="BankTransactions">Bank Transactions</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>
                            
                            <div class="form-group">
                                <label for="language">Language</label>
                                <select id="language" name="language" class="form-select">
                                    <option value="en">English</option>
                                    <option value="fi">Finnish</option>
                                    <option value="sv">Swedish</option>
                                </select>
                            </div>
                        </div>
                        
                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary">
                                <span class="btn-icon">🔍</span>
                                Fetch Events
                            </button>
                            <button type="button" class="btn btn-secondary" data-clear-form="generalLedgerForm">
                                <span class="btn-icon">🗑️</span>
                                Clear
                            </button>
                        </div>
                    </form>
                </div>
            </section>

            <!-- Account Balances Tab -->
            <section id="account-balances-tab" class="tab-content">
                <div class="form-section">
                    <h2 class="section-title">Account Balances Query</h2>
                    <form id="accountBalancesForm" class="form">
                        <div class="form-grid">
                            <div class="form-group">
                                <label for="balanceOrgNumber">Organization Number *</label>
                                <input type="text" id="balanceOrgNumber" name="organizationNumber" required 
                                       placeholder="e.g., 1234567-8" class="form-input">
                            </div>
                            
                            <div class="form-group">
                                <label for="balanceDate">Date *</label>
                                <input type="date" id="balanceDate" name="date" required class="form-input">
                            </div>
                            
                            <div class="form-group">
                                <label for="balanceAccountNumbers">Account Numbers *</label>
                                <input type="text" id="balanceAccountNumbers" name="accountNumbers" required
                                       placeholder="e.g., 1701,3000" class="form-input">
                                <small class="form-hint">Comma-separated list of account numbers</small>
                            </div>
                            
                            <div class="form-group">
                                <label for="balanceLanguage">Language</label>
                                <select id="balanceLanguage" name="language" class="form-select">
                                    <option value="en">English</option>
                                    <option value="fi">Finnish</option>
                                    <option value="sv">Swedish</option>
                                </select>
                            </div>
                        </div>
                        
                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary">
                                <span class="btn-icon">💰</span>
                                Get Balances
                            </button>
                            <button type="button" class="btn btn-secondary" data-clear-form="accountBalancesForm">
                                <span class="btn-icon">🗑️</span>
                                Clear
                            </button>
                        </div>
                    </form>
                </div>
            </section>

            <!-- Chart of Accounts Tab -->
            <section id="chart-accounts-tab" class="tab-content">
                <div class="form-section">
                    <h2 class="section-title">Chart of Accounts Query</h2>
                    <form id="chartAccountsForm" class="form">
                        <div class="form-grid">
                            <div class="form-group">
                                <label for="chartOrgNumber">Organization Number *</label>
                                <input type="text" id="chartOrgNumber" name="organizationNumber" required 
                                       placeholder="e.g., 1234567-8" class="form-input">
                            </div>
                            
                            <div class="form-group">
                                <label for="chartFromDate">From Date</label>
                                <input type="date" id="chartFromDate" name="fromDate" class="form-input">
                            </div>
                            
                            <div class="form-group">
                                <label for="chartToDate">To Date</label>
                                <input type="date" id="chartToDate" name="toDate" class="form-input">
                            </div>
                            
                            <div class="form-group">
                                <label for="chartLanguage">Language</label>
                                <select id="chartLanguage" name="language" class="form-select">
                                    <option value="en">English</option>
                                    <option value="fi">Finnish</option>
                                    <option value="sv">Swedish</option>
                                </select>
                            </div>
                        </div>
                        
                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary">
                                <span class="btn-icon">📊</span>
                                Get Chart of Accounts
                            </button>
                            <button type="button" class="btn btn-secondary" data-clear-form="chartAccountsForm">
                                <span class="btn-icon">🗑️</span>
                                Clear
                            </button>
                        </div>
                    </form>
                </div>
            </section>

            <!-- File Upload Tab -->
            <section id="file-upload-tab" class="tab-content">
                <div class="form-section">
                    <h2 class="section-title">File Processing</h2>
                    <form id="fileUploadForm" class="form">
                        <div class="file-upload-area" id="fileUploadArea">
                            <div class="file-upload-content">
                                <span class="file-upload-icon">📁</span>
                                <p class="file-upload-text">Drag & drop your CSV or Excel file here</p>
                                <p class="file-upload-subtext">or click to browse</p>
                                <input type="file" id="fileInput" name="file" accept=".csv,.xlsx,.xls" hidden>
                            </div>
                        </div>
                        
                        <div class="form-actions">
                            <button type="button" class="btn btn-secondary" id="browseFileBtn">
                                <span class="btn-icon">📂</span>
                                Browse Files
                            </button>
                            <button type="submit" class="btn btn-primary" id="processFileBtn" disabled>
                                <span class="btn-icon">📤</span>
                                Process File
                            </button>
                            <button type="button" class="btn btn-info" id="testConnectionBtn">
                                <span class="btn-icon">🔧</span>
                                Test Connection
                            </button>
                            <button type="button" class="btn btn-secondary" id="clearFileBtn">
                                <span class="btn-icon">🗑️</span>
                                Clear
                            </button>
                        </div>
                    </form>
                </div>
            </section>

        </main>

        <!-- Results Section -->
        <section class="results-section" id="resultsSection" style="display: none;">
            <div class="results-header">
                <h3 class="results-title">Results</h3>
                <div class="results-actions">
                    <button class="btn btn-small" onclick="exportResults()">
                        <span class="btn-icon">📥</span>
                        Export JSON
                    </button>
                    <button class="btn btn-small btn-secondary" onclick="hideResults()">
                        <span class="btn-icon">✕</span>
                        Close
                    </button>
                </div>
            </div>
            <div class="results-content" id="resultsContent">
                <!-- Results will be populated here -->
            </div>
        </section>

        <!-- Loading Spinner -->
        <div class="loading-overlay" id="loadingOverlay">
            <div class="loading-spinner">
                <div class="spinner"></div>
                <p>Processing request...</p>
            </div>
        </div>

    </div>

    <!-- Toast Notifications -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="script.js"></script>
    <script>
        // Fallback for file upload button
        window.addEventListener('load', function() {
            const btn = document.getElementById('browseFileBtn');
            const input = document.getElementById('fileInput');
            if (btn && input) {
                btn.onclick = function() { input.click(); };
                console.log('Fallback file upload button initialized');
            }
        });
    </script>
</body>
</html>
